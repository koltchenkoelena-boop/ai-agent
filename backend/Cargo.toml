[package]
name = "rust-vue-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { version = "4.0", features = ["ws"] }
actix-session = "0.6"
actix-files = "0.6"
oauth2 = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
uuid = { version = "1.0", features = ["v4"] }
jsonwebtoken = "8.0"
actix-web-actors = "4.0"
rand = "0.8"
base64 = "0.21"